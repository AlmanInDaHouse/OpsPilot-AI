name: opspilot-s02
services:
  postgres:
    image: opspilot-postgres:18.6-s02
    build:
      context: ..
      dockerfile: infra/postgres.Dockerfile
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [pg_admin]
    ports: ["127.0.0.1:59432:5432"]
    volumes: ["pg_data:/var/lib/postgresql"]
    networks: [data]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 2s
      retries: 40
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    entrypoint: ["/bin/bash", "/opt/lab/start-keycloak.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/opspilot_keycloak
      KC_DB_USERNAME: opspilot_keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_HOSTNAME: http://127.0.0.1:59080
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    secrets: [kc_admin, kc_db]
    volumes:
      - ./start-keycloak.sh:/opt/lab/start-keycloak.sh:ro
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["127.0.0.1:59080:8080"]
    networks: [data, identity]
    mem_limit: 768m
    cpus: 1.5
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    image: opspilot-ai:0.2.0
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    environment:
      OPSPILOT_ENVIRONMENT: lab
      OPSPILOT_DATABASE_DSN_FILE: /run/secrets/app_dsn
      OPSPILOT_OIDC_ISSUER: http://127.0.0.1:59080/realms/opspilot
      OPSPILOT_OIDC_AUDIENCE: opspilot-api
      OPSPILOT_OIDC_JWKS_URL: http://keycloak:8080/realms/opspilot/protocol/openid-connect/certs
    secrets: [app_dsn]
    ports: ["127.0.0.1:59000:8000"]
    networks: [data, identity]
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
  tests:
    image: opspilot-tests:0.2.0
    profiles: [test]
    user: "${OPSPILOT_TEST_UID:-10001}:${OPSPILOT_TEST_GID:-10001}"
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    environment:
      OPSPILOT_LAB_DIR: /lab
      OPSPILOT_LAB_INTERNAL: "1"
    volumes: ["../artifacts/local:/lab", "../artifacts/session-02:/evidence"]
    networks: [data, identity]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1024m
    cpus: 2.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["/app/.venv/bin/python", "-m", "pytest", "tests/integration", "-o", "cache_dir=/tmp/pytest-cache", "--junitxml=/evidence/integration-linux.xml", "-q"]
networks:
  data: {}
  identity: {}
volumes:
  pg_data: {}
secrets:
  pg_admin: {file: ../artifacts/local/pg_admin}
  kc_admin: {file: ../artifacts/local/kc_admin}
  kc_db: {file: ../artifacts/local/kc_db}
  app_dsn: {file: ../artifacts/local/app-internal.dsn}
