name: Platform S02 gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.11.13
      - run: python scripts/dev.py install
      - run: python scripts/dev.py check
      - run: python scripts/dev.py test --suite local
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - run: python -m pip install uv==0.11.13
      - run: python scripts/dev.py install
      - run: python scripts/verify_scanner_environment.py --report artifacts/session-02/ci/scanner-environment.json
      - run: python scripts/dev.py infra
      - run: python scripts/dev.py up
      - run: uv run --frozen pytest --junitxml=artifacts/session-02/ci/tests-ci.xml
      - run: uv run --frozen python scripts/verify_fresh_postgres.py --report artifacts/session-02/ci/fresh-postgres.json
      - run: uv run --frozen python scripts/verify_recovery.py --report artifacts/session-02/ci/recovery.json
      - run: uv run --frozen python scripts/scan_images.py --evidence-dir artifacts/session-02/ci/scans
      - run: uv run --frozen python scripts/verify_session02.py --manifest-only --evidence-dir artifacts/session-02/ci
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: platform-s02-evidence
          path: artifacts/session-02/ci/
          if-no-files-found: error
      - run: python scripts/dev.py stop
        if: always()
